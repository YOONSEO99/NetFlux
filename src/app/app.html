<div class="app-container">
  <header class="top-header">
    <div class="logo-section">
      <img src="images/Logo.png" alt="NetFlux Logo">
      <h1>NetFlux</h1>
    </div>
    <div class="system-status">
      <span>{{currentDate | date: 'medium'}}</span>
      <div class="status-badge">System: {{nowStatus}}</div>
    </div>
  </header>

  <div class="body-wrapper">
    <aside class="sidebar" *ngIf="currentUser">
      <nav class="menu-links">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
        <a routerLink="/topology" routerLinkActive="active">Topology</a>
        <a routerLink="/logs" routerLinkActive="active">Logs</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="ment">Welcome</span><br>
          <span class="user-name" (click)="onEditUser()">{{currentUser.username}} !</span>
        </div><br>
        <button class="logout-btn" (click)="onLogout()">Logout</button>
      </div>
    </aside>
    <main class="content" [style.width]="currentUser ? 'calc(100% - 250px)' : '100%'">
      <router-outlet></router-outlet>
    </main>
  </div>
  <div class="userEditModal" *ngIf="isModalOpen">
    <div class="modal-content">
      <h2>Profile Update</h2>

      <div class="input-group">
        <label>ID</label>
        <input type="text" [(ngModel)]="userEdit.id" readonly style="background-color: #1a1a1a; cursor: not-allowed;">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="userEdit.password" placeholder="input new Password">
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="userEdit.confirmPassword" placeholder="input new Password again">
      </div>

      <div class="input-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="userEdit.username">
      </div>
      <div class="modal-action">
        <button class="save-btn" (click)="onUserUpdate()">Save</button>
        <button class="cancel-btn" (click)="isModalOpen = false">Cancel</button>
      </div>
    </div>
  </div>
</div>
